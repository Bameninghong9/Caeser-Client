<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Caeser Client - Spielprotokoll</title>
  <style>
    :root {
      --accent: #b23cee;
      --bg: #0e0d14;
      --surface: #15131e;
      --surface-hover: #1c1928;
      --surface-border: rgba(255, 255, 255, 0.08);
      --text: #eae6f2;
      --muted: #887d96;
      --info: #80c7ff;
      --warn: #ffbe3b;
      --error: #ff4766;
      --success: #00e676;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Titlebar */
    .titlebar {
      height: 36px;
      background: #09080e;
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 14px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      z-index: 20;
    }
    .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #9f94af;
    }
    .title-icon {
      width: 18px;
      height: 18px;
      background-color: var(--accent);
      -webkit-mask: url('assets/logo.png') no-repeat center / contain;
      mask: url('assets/logo.png') no-repeat center / contain;
    }
    .title-actions {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }
    .win-btn {
      width: 44px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      color: #9f94af;
      cursor: pointer;
      font-size: 15px;
      transition: background .15s, color .15s;
    }
    .win-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
    .win-btn.close:hover { background: #e81123; color: #ffffff; }

    /* App Workspace Layout: Left Terminal, Right Instances Sidebar */
    .app-body {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }

    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #09080e;
    }

    /* Toolbar */
    .toolbar {
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;
    }
    .status-badge.running { background: rgba(0, 230, 118, 0.12); border-color: rgba(0, 230, 118, 0.35); color: #4ce68f; }
    .status-badge.running .status-dot { background: #00e676; box-shadow: 0 0 8px #00e676; animation: pulse 1.8s infinite; }
    .status-badge.starting { background: rgba(255, 190, 59, 0.12); border-color: rgba(255, 190, 59, 0.35); color: #ffbe3b; }
    .status-badge.starting .status-dot { background: #ffbe3b; box-shadow: 0 0 8px #ffbe3b; }
    .status-badge.stopped { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); color: #9f94af; }
    .status-badge.stopped .status-dot { background: #665f72; }
    .status-badge.crashed { background: rgba(255, 71, 102, 0.12); border-color: rgba(255, 71, 102, 0.35); color: #ff4766; }
    .status-badge.crashed .status-dot { background: #ff4766; box-shadow: 0 0 8px #ff4766; }

    .profile-badge {
      font-size: 11px;
      color: #b5a9c7;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--surface-border);
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: 600;
    }
    .profile-badge strong { color: #fff; margin-left: 4px; }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 130px;
      max-width: 240px;
    }
    .search-input {
      width: 100%;
      background: #0f0d15;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 6px 10px 6px 28px;
      color: #fff;
      font-size: 11px;
      outline: none;
      transition: border-color .18s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 13px;
      height: 13px;
      fill: none;
      stroke: #776a88;
      stroke-width: 2;
      pointer-events: none;
    }

    .tool-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--surface-border);
      background: rgba(255, 255, 255, 0.04);
      color: #c0b5cf;
      cursor: pointer;
      transition: all .16s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn.active {
      background: color-mix(in srgb, var(--accent) 22%, #1b1724);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-danger:hover {
      background: rgba(255, 71, 102, 0.16);
      border-color: rgba(255, 71, 102, 0.4);
      color: #ff4766;
    }
    .line-counter {
      font-size: 11px;
      color: var(--muted);
      margin-left: 4px;
      font-variant-numeric: tabular-nums;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn:disabled:hover { background: rgba(255, 255, 255, 0.04); color: #c0b5cf; border-color: var(--surface-border); }

    /* Meldung nach dem Teilen über mclo.gs */
    .share-notice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      font-size: 11px;
      color: #4ce68f;
      background: rgba(0, 230, 118, 0.08);
      border-bottom: 1px solid rgba(0, 230, 118, 0.25);
      flex-shrink: 0;
    }
    .share-notice.error { color: #ff4766; background: rgba(255, 71, 102, 0.08); border-bottom-color: rgba(255, 71, 102, 0.25); }
    .share-notice span { overflow-wrap: anywhere; }
    .share-notice .btn { margin-left: auto; flex-shrink: 0; }

    /* Terminal Console */
    .terminal-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px;
      background: #09080e;
      font-family: 'Consolas', 'Cascadia Code', 'Fira Code', Menlo, monospace;
      font-size: 11.5px;
      line-height: 1.6;
      user-select: text;
    }
    .terminal-container::-webkit-scrollbar { width: 8px; }
    .terminal-container::-webkit-scrollbar-thumb { background: #262132; border-radius: 4px; }
    .terminal-container::-webkit-scrollbar-thumb:hover { background: #3b334e; }

    .log-line {
      display: flex;
      align-items: flex-start;
      padding: 1px 0;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .log-num {
      width: 44px;
      flex-shrink: 0;
      color: #484055;
      text-align: right;
      padding-right: 12px;
      user-select: none;
    }
    .log-text {
      flex: 1;
      color: #c9c0d6;
    }
    .log-line.info .log-text { color: #d0c8dd; }
    .log-line.warn .log-text { color: var(--warn); }
    .log-line.warn { background: rgba(255, 190, 59, 0.05); }
    .log-line.error .log-text { color: var(--error); font-weight: 600; }
    .log-line.error { background: rgba(255, 71, 102, 0.08); }
    .empty-notice {
      color: #5d536e;
      text-align: center;
      padding: 60px 20px;
      font-family: inherit;
    }

    /* Instances Sidebar (Right Panel) */
    .instances-sidebar {
      width: 260px;
      min-width: 260px;
      background: #110f17;
      border-left: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #15121e;
    }
    .sidebar-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #b5a4cb;
    }
    .sidebar-title-group svg {
      width: 15px;
      height: 15px;
      color: var(--accent);
    }
    .instances-count-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 25%, transparent);
      color: color-mix(in srgb, var(--accent) 80%, #fff);
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    }

    .instances-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .instances-list::-webkit-scrollbar { width: 6px; }
    .instances-list::-webkit-scrollbar-thumb { background: #262132; border-radius: 3px; }

    .instance-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #171420;
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: all .18s ease;
    }
    .instance-card:hover {
      background: #1f1a2b;
      border-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }
    .instance-card.active {
      background: color-mix(in srgb, var(--accent) 14%, #181423);
      border-color: var(--accent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 22%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .instance-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #251d30;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
    }
    .instance-icon svg { width: 18px; height: 18px; }

    .instance-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .instance-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .instance-sub {
      font-size: 10px;
      color: #9284a3;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .instance-uptime {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .instance-uptime.running { color: #00e676; }
    .instance-uptime.running::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 6px #00e676;
      animation: pulse 1.8s infinite;
    }
    .instance-uptime.stopped { color: #887d96; }
    .instance-uptime.crashed { color: #ff4766; }

    .instance-card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .btn-card-stop {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: 1px solid rgba(255, 71, 102, 0.3);
      background: rgba(255, 71, 102, 0.12);
      color: #ff4766;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all .15s ease;
    }
    .btn-card-stop:hover {
      background: #ff4766;
      color: #fff;
      box-shadow: 0 0 8px rgba(255, 71, 102, 0.4);
    }
    .btn-card-stop svg { width: 11px; height: 11px; }

    .btn-card-close {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: #7b6f8b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all .15s ease;
    }
    .btn-card-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .btn-card-close svg { width: 11px; height: 11px; }

    .no-instances-notice {
      padding: 30px 14px;
      text-align: center;
      color: #635773;
      font-size: 11px;
    }

    /* Sidebar Footer */
    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--surface-border);
      background: #14111d;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-actions-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-sidebar-stopp {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 71, 102, 0.4);
      background: linear-gradient(135deg, rgba(255, 71, 102, 0.25), rgba(210, 30, 60, 0.35));
      color: #ff5272;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all .16s ease;
    }
    .btn-sidebar-stopp:hover:not(:disabled) {
      background: #ff3355;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(255, 51, 85, 0.45);
      transform: translateY(-1px);
    }
    .btn-sidebar-stopp:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #837693;
    }
    .btn-sidebar-stopp svg { width: 12px; height: 12px; }

    .sidebar-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #8c7e9d;
      text-transform: uppercase;
    }
    .sidebar-summary .running-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #4ce68f;
    }
    .sidebar-summary .running-tag::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00e676;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="title-left">
      <div class="title-icon"></div>
      <span id="titlebar-heading">CAESER CLIENT · SPIELPROTOKOLL</span>
    </div>
    <div class="title-actions">
      <button class="win-btn" id="win-min" aria-label="Minimieren">−</button>
      <button class="win-btn" id="win-max" aria-label="Maximieren">□</button>
      <button class="win-btn close" id="win-close" aria-label="Schließen">×</button>
    </div>
  </div>

  <div class="app-body">
    <div class="main-panel">
      <div class="toolbar">
        <div class="status-badge" id="status-badge">
          <span class="status-dot"></span>
          <span id="status-text">Warte auf Spielstart …</span>
        </div>
        <div class="profile-badge"><span id="lbl-profile">Profil:</span> <strong id="profile-name">Caeser</strong></div>

        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Im Log suchen …" spellcheck="false">
        </div>

        <div class="tool-actions">
          <button class="btn active" id="btn-autoscroll" title="Automatisches Herunterscrollen">
            <span>⬇ Auto-Scroll</span>
          </button>
          <button class="btn" id="btn-copy" title="Gesamtes Log in die Zwischenablage kopieren">
            <span id="btn-copy-text">📋 Kopieren</span>
          </button>
          <button class="btn" id="btn-share" title="Log geschwärzt auf mclo.gs hochladen und Link kopieren" disabled>
            <span id="btn-share-text">🔗 Teilen</span>
          </button>
          <button class="btn" id="btn-save" title="Log der gewählten Instanz als Textdatei speichern" disabled>
            <span id="btn-save-text">💾 Speichern</span>
          </button>
          <button class="btn btn-danger" id="btn-clear" title="Log-Ansicht leeren">
            <span id="btn-clear-text">🗑️ Leeren</span>
          </button>
          <span class="line-counter" id="line-counter">0 Zeilen</span>
        </div>
      </div>

      <div class="share-notice" id="share-notice" hidden>
        <span id="share-notice-text"></span>
        <button class="btn" id="btn-share-open">Im Browser öffnen</button>
      </div>

      <div class="terminal-container" id="terminal">
        <div class="empty-notice" id="empty-notice">Noch keine Log-Einträge vorhanden. Starte Minecraft, um die Ausgaben live zu verfolgen.</div>
      </div>
    </div>

    <!-- Instances Sidebar -->
    <aside class="instances-sidebar" id="instances-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span id="sidebar-title-text">Instanzen</span>
        </div>
        <span class="instances-count-badge" id="instances-count-badge">0</span>
      </div>

      <div class="instances-list" id="instances-list">
        <div class="no-instances-notice" id="no-instances-notice">Keine aktiven Instanzen vorhanden.</div>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-actions-row">
          <button class="btn-sidebar-stopp" id="btn-sidebar-stopp" disabled title="Dieses Minecraft-Spiel beenden">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="5" width="14" height="14" rx="2"></rect>
            </svg>
            <span id="btn-sidebar-stopp-text">STOPP</span>
          </button>
        </div>
        <div class="sidebar-summary">
          <span id="sidebar-summary-name">-</span>
          <span class="running-tag" id="sidebar-summary-running">0 LÄUFT</span>
        </div>
      </div>
    </aside>
  </div>

  <script src="log-window.js"></script>
</body>
</html>
